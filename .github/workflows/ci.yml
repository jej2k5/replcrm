name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Credential-free verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Syntax-only Prisma validation; no service/database connection is used.
      DATABASE_URL: postgresql://user:password@127.0.0.1:5432/replcrm_ci

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run build
      - run: npx prisma validate
      - run: npm test
      - run: npm run smoke-test
      - run: git diff --check
